services:

  openclaw:
    build: ./gateway/openclaw
    ports:
      - "18789:18789"
    command:
      [
        "node",
        "openclaw.mjs",
        "gateway",
        "--bind",
        "lan",
        "--allow-unconfigured"
      ]
    environment:
      gateway__controlUi__allowedOrigins: "*"
    volumes:
     - ./workspace:/workspace

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - openclaw
    volumes:
      - ./workspace:/workspace
      
  worker:
    build: ./api
    command: python -m app.workers.agent_worker
    volumes:
      - ./workspace:/workspace
    depends_on:
      - api