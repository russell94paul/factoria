services:

  openclaw:
    build: ./gateway/openclaw
    ports:
    - "18789:18789"
    command:
      [
      "node",
      "openclaw.mjs",
      "gateway",
      "--bind",
      "lan",
      "--allow-unconfigured"
      ]
    environment:
      gateway__controlUi__allowedOrigins: "*"
    volumes:
      - ./workspace:/workspace

  runner:
    build: ./runner/app
    ports:
    - "9000:9000"
    environment:
      WORKSPACES_ROOT: /workspace
    volumes:
      - ./workspace:/workspace

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - openclaw
      - runner
    environment:
      RUNNER_URL: http://runner:9000
      WORKSPACES_ROOT: /workspace
    volumes:
      - ./workspace:/workspace

  worker:
    build: ./api
    command:
      - sh
      - -c
      - python -m app.workers.wait_for_gateway && python -m app.workers.agent_worker
    environment:
      RUNNER_URL: http://runner:9000
      WORKSPACES_ROOT: /workspace
    volumes:
      - ./workspace:/workspace
    depends_on:
      - api
      - runner

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api